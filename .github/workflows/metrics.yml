name: Save usage history

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # History lives on its own branch, so main only changes through reviewed merges.
      - name: Open the metrics branch
        run: |
          if git fetch origin metrics; then
            git worktree add .metrics FETCH_HEAD
          else
            git worktree add --orphan -b metrics .metrics
          fi
      - run: node tools/metrics.mjs --dir .metrics
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save the history
        working-directory: .metrics
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update usage history"
          git push origin HEAD:metrics
